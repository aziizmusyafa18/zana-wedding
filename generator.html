<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Pesan WhatsApp</title>
    <!-- Font & CSS dari Undangan Utama -->
    <link rel="shortcut icon" href="img/icon2.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* Tambahan gaya khusus halaman generator menyesuaikan tema undangan */
      .generator-container {
        max-width: 800px;
        margin: 3rem auto;
        /* Efek Kaca (Glassmorphism) yang jauh lebih transparan */
        background-color: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: var(--dark-cocoa);
      }
      h1.generator-title {
        font-family: "Cormorant Garamond", serif;
        color: var(--earthy-brown);
        border-bottom: 2px solid var(--border-cream);
        padding-bottom: 0.5rem;
      }
      .generator-subtitle {
        font-size: 0.95rem;
        color: var(--dark-cocoa);
        opacity: 0.8;
      }
      .form-label {
        font-weight: bold;
        color: var(--earthy-brown);
      }
      .form-control {
        border: 1px solid rgba(255, 255, 255, 0.6);
        background-color: rgba(255, 255, 255, 0.3);
        color: var(--dark-cocoa);
      }
      .form-control:focus {
        box-shadow: 0 0 0 0.25rem rgba(184, 146, 77, 0.25);
        border-color: var(--antique-gold);
      }
      .btn-theme {
        background-color: var(--earthy-brown);
        color: var(--cream-bg);
        font-weight: bold;
        border: none;
        transition: 0.3s;
      }
      .btn-theme:hover {
        background-color: var(--dark-cocoa);
        color: var(--antique-gold);
      }
      .result-item {
        border: 1px solid rgba(255, 255, 255, 0.5);
        padding: 1.5rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      }
      .preview-text {
        white-space: pre-wrap;
        background: rgba(255, 255, 255, 0.4);
        padding: 1rem;
        border-radius: 6px;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-top: 1rem;
        border-left: 4px solid var(--antique-gold);
      }
      .btn-wa {
        background-color: #25d366;
        color: white;
        border: none;
      }
      .btn-wa:hover {
        background-color: #1ebe5d;
        color: white;
      }
      .btn-copy {
        background-color: var(--border-cream);
        color: var(--dark-cocoa);
        border: none;
      }
      .btn-copy:hover {
        background-color: var(--antique-gold);
        color: white;
      }
      @media (max-width: 576px) {
        .generator-container {
          margin: 1.5rem auto;
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body class="font-sans-jawa">
    <div class="container">
      <div class="generator-container">
        <h1 class="generator-title text-center mb-2">Generator Pesan WhatsApp</h1>
        <p class="generator-subtitle text-center mb-4">
          Masukkan daftar nama tamu (satu baris per nama) untuk meracik otomatis link dan pesan undangan.
        </p>

        <div class="mb-4">
          <label class="form-label">Daftar Nama Tamu</label>
          <textarea
            id="guestList"
            class="form-control"
            rows="8"
            placeholder="Ketik nama tamu di sini...&#10;Contoh:&#10;&#10;Bapak Budi Santoso&#10;Keluarga Ibu Siti"
          ></textarea>
        </div>

        <button class="btn btn-theme w-100 py-3 mb-4 fs-5" onclick="generateLinks()">
          <i class="bi bi-whatsapp me-2"></i> Buat Pesan WhatsApp Sekarang
        </button>

        <div id="results"></div>
      </div>
    </div>

    <script>
      function getMessageTemplate(
        guestName,
        invitationLink,
        wanita,
        pria,
        signature,
      ) {
        return `Kepada Yth.\nBapak/Ibu/Saudara/i\n\n_Assalamualaikum Warahmatullahi Wabarakaatuh_\nDengan memohon rahmat dan ridho Allah SWT, perkenankan kami mengundang Bapak/Ibu/Saudara/i *${guestName}* untuk menghadiri acara pernikahan kami :\n\n🤵🏻 *${pria}*\n\ndengan\n\n🧕🏻 *${wanita}*\n\n*Untuk informasi detail mengenai acara, silahkan kunjungi link dibawah ini :*\n\n*${invitationLink}*\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.\nAtas kehadiran dan doa restunya kami ucapkan terima kasih.\n_Wassalamualaikum Warahmatullahi Wabarakaatuh_\n\nHormat kami,\n*${signature}*`;
      }

      function generateLinks() {
        const guestsText = document.getElementById("guestList").value;
        const resultsContainer = document.getElementById("results");

        // Konfigurasi otomatis dari placeholder (diatur oleh developer)
        let baseUrl = "{{ BASE_INVITATION_URL }}".trim();
        const namaWanita = "{{ NAMA_WANITA_LENGKAP }}";
        const namaPria = "{{ NAMA_PRIA_LENGKAP }}";
        const signature = "{{ NAMA_WANITA_PANGGILAN }} & {{ NAMA_PRIA_PANGGILAN }}";

        if (baseUrl && !baseUrl.endsWith("/")) {
          baseUrl += "/";
        }

        resultsContainer.innerHTML = '<h3 class="generator-title mt-4 mb-3 fs-4">Hasil Pesan:</h3>';

        const guests = guestsText
          .split("\n")
          .map((g) => g.trim())
          .filter((g) => g.length > 0);

        if (guests.length === 0) {
          resultsContainer.innerHTML +=
            '<div class="alert alert-danger d-flex align-items-center"><i class="bi bi-exclamation-triangle-fill me-2"></i> Silakan masukkan minimal satu nama tamu terlebih dahulu!</div>';
          return;
        }

        guests.forEach((guest, index) => {
          const encodedGuestName = encodeURIComponent(guest);
          const invitationLink = `${baseUrl}#${encodedGuestName}`;
          
          const messageText = getMessageTemplate(guest, invitationLink, namaWanita, namaPria, signature);
          const encodedMessage = encodeURIComponent(messageText);
          const waLink = `https://wa.me/?text=${encodedMessage}`;
          
          const safeMessage = messageText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

          resultsContainer.innerHTML += `
            <div class="result-item">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <h5 class="mb-0 text-dark fw-bold" style="color: var(--dark-cocoa) !important;">${index + 1}. Untuk: ${guest}</h5>
                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn btn-copy btn-sm fw-bold px-3 py-2" onclick="copyText(this, \`${encodedMessage}\`)">
                    <i class="bi bi-copy"></i> Salin Teks
                  </button>
                  <a href="${waLink}" target="_blank" class="btn btn-wa btn-sm fw-bold px-3 py-2">
                    <i class="bi bi-whatsapp"></i> Buka WhatsApp
                  </a>
                </div>
              </div>
              <div class="preview-text">${safeMessage}</div>
            </div>
          `;
        });
      }

      function copyText(btn, encodedText) {
        const text = decodeURIComponent(encodedText);
        navigator.clipboard.writeText(text).then(() => {
          const originalHTML = btn.innerHTML;
          btn.innerHTML = '<i class="bi bi-check2"></i> Tersalin!';
          btn.classList.add('bg-success', 'text-white');
          btn.classList.remove('btn-copy');
          setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.remove('bg-success', 'text-white');
            btn.classList.add('btn-copy');
          }, 2000);
        }).catch(err => {
          alert("Gagal menyalin teks. Silakan salin manual.");
        });
      }
    </script>
  </body>
</html>
